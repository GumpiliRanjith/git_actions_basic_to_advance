name: hellowrod

on: push

jobs:
    kumar:
        runs-on: ubuntu-latest

        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: list the files
              run: ls -ls

            - name: checkout python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'

            - name: install dependencies
              run : pip install -r requirements.txt

            - name: run flask code
              run: python app.py